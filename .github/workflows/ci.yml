name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, mysql, redis, zip
          ini-values: expose_php=Off
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: composer check-platform-reqs
      - run: composer audit --locked --no-interaction
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: php artisan migrate:fresh --seed --force
      - name: Verify F7 migration upgrade and rollback
        env:
          DB_ADMIN_USERNAME: root
          DB_ADMIN_PASSWORD: password
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          bash tests/Support/f7-migration-harness.sh
      - name: Verify F8 migration upgrade and security-lossy rollback
        env:
          DB_ADMIN_USERNAME: root
          DB_ADMIN_PASSWORD: password
        run: bash tests/Support/f8-migration-harness.sh
      - run: php artisan test
      - run: php artisan view:cache
      - run: php artisan route:list
      - run: php artisan schedule:list
      - run: vendor/bin/pint --test
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: f9a-query-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/framework/testing/f9a-query-profile.json
          if-no-files-found: warn
          retention-days: 14

  analytics-runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_analytics
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing_analytics
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_STORE: redis
      CACHE_PREFIX: f7-${{ github.run_id }}-${{ github.run_attempt }}-
      REDIS_PREFIX: f7-${{ github.run_id }}-${{ github.run_attempt }}-
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SESSION_DRIVER: array
      ANALYTICS_RUNTIME_TESTS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, mysql, redis, zip
          ini-values: expose_php=Off
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: php artisan migrate:fresh --force
      - run: php artisan test tests/Integration/AnalyticsRedisRuntimeTest.php
      - run: php artisan schedule:list

  staff-runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_staff
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing_staff
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_STORE: redis
      CACHE_PREFIX: f8-${{ github.run_id }}-${{ github.run_attempt }}-
      REDIS_PREFIX: f8-${{ github.run_id }}-${{ github.run_attempt }}-
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      STAFF_RUNTIME_TESTS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, mysql, redis, zip
          ini-values: expose_php=Off
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: php artisan migrate:fresh --force
      - run: php artisan test tests/Integration/StaffRedisRuntimeTest.php

  security:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_security
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing_security
      DB_USERNAME: sail
      DB_PASSWORD: password
      CACHE_STORE: redis
      CACHE_PREFIX: f9a-security-${{ github.run_id }}-${{ github.run_attempt }}-
      REDIS_PREFIX: f9a-security-${{ github.run_id }}-${{ github.run_attempt }}-
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, mysql, redis, zip
          ini-values: expose_php=Off
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Composer advisory scan
        run: |
          mkdir -p storage/framework/testing
          set -o pipefail
          composer audit --locked --no-interaction 2>&1 | tee storage/framework/testing/f9a-composer-audit.txt
      - run: npm ci
      - name: npm high-severity advisory scan
        run: npm audit --audit-level=high --json > storage/framework/testing/f9a-npm-audit.json
      - name: Scan the complete repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b \
            git /repo --redact --verbose --report-format=json --report-path=/repo/storage/framework/testing/f9a-gitleaks-history.json
          bash tests/Support/f9a-secret-tree-scan.sh
      - run: php artisan migrate:fresh --force
      - run: php artisan test tests/Unit/SensitiveDataRedactorTest.php tests/Feature/Phase9SecurityHardeningTest.php
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: f9a-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            storage/framework/testing/f9a-composer-audit.txt
            storage/framework/testing/f9a-npm-audit.json
            storage/framework/testing/f9a-gitleaks-history.json
            storage/framework/testing/f9a-gitleaks-tree.json
          if-no-files-found: warn
          retention-days: 14

  hardening-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_hardening_smoke
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing_hardening_smoke
      DB_USERNAME: sail
      DB_PASSWORD: password
      BCRYPT_ROUNDS: 4
      CACHE_STORE: redis
      CACHE_PREFIX: f9a-smoke-${{ github.run_id }}-${{ github.run_attempt }}-
      REDIS_PREFIX: f9a-smoke-${{ github.run_id }}-${{ github.run_attempt }}-
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      HARDENING_RUNTIME_TESTS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, mysql, redis, zip
          ini-values: expose_php=Off
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: php artisan migrate:fresh --force
      - run: php artisan hardening:seed --profile=smoke
      - run: php artisan test tests/Integration/Phase9RedisRateLimitTest.php
      - name: Start isolated hardening server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d expose_php=0 artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/f9a-smoke-server.log 2>&1 &
          php artisan queue:work redis --queue=analytics,default --sleep=0 --tries=3 --timeout=120 > storage/logs/f9a-smoke-worker.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/up >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run k6 smoke profile
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            grafana/k6:2.1.0@sha256:65c920dc067d5e2e00befbf982af6ad6ad0117034e8b1c65817c7975c52d4669 run \
            -e F9A_PROFILE=smoke \
            -e BASE_URL=http://127.0.0.1:8000 \
            -e F9A_API_BASE_URL=http://localhost:8000 \
            -e F9A_MANIFEST=/work/storage/framework/testing/f9a-hardening-manifest.json \
            -e K6_SUMMARY_PATH=/work/storage/framework/testing/f9a-k6-smoke-summary.json \
            tests/Load/f9a-hardening.js
      - name: Run isolated idempotency and expected-conflict profile
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            grafana/k6:2.1.0@sha256:65c920dc067d5e2e00befbf982af6ad6ad0117034e8b1c65817c7975c52d4669 run \
            -e BASE_URL=http://127.0.0.1:8000 \
            -e F9A_MANIFEST=/work/storage/framework/testing/f9a-hardening-manifest.json \
            -e K6_CONFLICT_SUMMARY_PATH=/work/storage/framework/testing/f9a-k6-conflicts-summary.json \
            tests/Load/f9a-conflicts.js
      - run: php artisan hardening:reconcile --output=storage/framework/testing/f9a-smoke-reconciliation.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: f9a-hardening-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            storage/framework/testing/f9a-k6-smoke-summary.json
            storage/framework/testing/f9a-k6-conflicts-summary.json
            storage/framework/testing/f9a-smoke-reconciliation.json
            storage/logs/f9a-smoke-server.log
            storage/logs/f9a-smoke-worker.log
          retention-days: 14

  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_hardening_browser
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing_hardening_browser
      DB_USERNAME: sail
      DB_PASSWORD: password
      BCRYPT_ROUNDS: 4
      CACHE_STORE: redis
      CACHE_PREFIX: f9a-browser-${{ github.run_id }}-${{ github.run_attempt }}-
      REDIS_PREFIX: f9a-browser-${{ github.run_id }}-${{ github.run_attempt }}-
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      F9A_BASE_URL: http://127.0.0.1:8000
      F9A_MANIFEST: storage/framework/testing/f9a-hardening-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, intl, mbstring, mysql, redis, zip
          ini-values: expose_php=Off
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - name: Generate ephemeral application key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: php artisan migrate:fresh --force
      - run: php artisan hardening:seed --profile=smoke
      - name: Start isolated browser server
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d expose_php=0 artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/f9a-browser-server.log 2>&1 &
          php artisan queue:work redis --queue=analytics,default --sleep=0 --tries=3 --timeout=120 > storage/logs/f9a-browser-worker.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/up >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:e2e:ci
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: f9a-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            storage/framework/testing/playwright-report
            storage/framework/testing/playwright-results
            storage/logs/f9a-browser-server.log
            storage/logs/f9a-browser-worker.log
          retention-days: 14
